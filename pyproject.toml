[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-analytics"
version = "0.2.0"
description = "Leakage-aware, reproducible TELCO churn portfolio project using synthetic data."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "EHDataAI"}]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.16.10,<1",
  "pre-commit>=4.6,<5",
  "pip-audit>=2.10.1,<3",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
